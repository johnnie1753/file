<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Windows 时间区域截图（手机专用）</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
    background:#f2f2f2;
    padding:20px;
    font-family: "Segoe UI", system-ui, -apple-system;
}

/* 模拟截图区域 */
#win-shot {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #000;
    color: #fff;
    padding: 6px 12px;
    height: 48px;
    width: 100%;
    max-width: 520px;
    box-sizing: border-box;
    margin: 0 auto;
}

/* 左侧图标 */
.icons {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 18px;
}

/* 语言 */
.lang {
    font-size: 15px;
    opacity: 0.95;
}

/* 时间日期 */
.time-box {
    text-align: center;
    margin-left: 6px;
    line-height: 1.1;
}

.time,
.date {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
}

/* 通知 */
.notify {
    margin-left: auto;
    font-size: 18px;
    position: relative;
}

.notify::after {
    content: "1";
    position: absolute;
    top: -6px;
    right: -6px;
    background: #0078d4;
    color: #fff;
    font-size: 10px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 按钮 */
button {
    display: block;
    margin: 18px auto 0;
    padding: 10px 18px;
    font-size: 15px;
    background: #0078d4;
    border: none;
    color: #fff;
    border-radius: 4px;
}

/* 预览 */
#preview {
    margin-top: 18px;
    text-align: center;
}

#preview img {
    max-width: 100%;
    border-radius: 6px;
    display: block;
    margin: 0 auto;
}

#preview .tip {
    margin-top: 6px;
    font-size: 14px;
    color: #666;
}
</style>
</head>

<body>

<div id="win-shot">
    <div class="icons">
        <span>🖥️</span>
        <span>🔊</span>
    </div>

    <div class="lang">ENG</div>

    <div class="time-box">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">0000/00/00</div>
    </div>

    <div class="notify">💬</div>
</div>

<button onclick="generate()">生成图片</button>

<div id="preview"></div>

<script>
// 北京时间（UTC+8）
function updateTime() {
    const now = new Date();
    const bj = new Date(now.getTime() + 8 * 60 * 60 * 1000);

    const h = String(bj.getUTCHours()).padStart(2, '0');
    const m = String(bj.getUTCMinutes()).padStart(2, '0');
    const y = bj.getUTCFullYear();
    const mo = String(bj.getUTCMonth() + 1).padStart(2, '0');
    const d = String(bj.getUTCDate()).padStart(2, '0');

    document.getElementById("time").textContent = `${h}:${m}`;
    document.getElementById("date").textContent = `${y}/${mo}/${d}`;
}

updateTime();
setInterval(updateTime, 60000);

// 生成图片（手机保存方案）
function generate() {
    html2canvas(document.getElementById("win-shot"), {
        backgroundColor: "#000",
        scale: 2
    }).then(canvas => {
        const img = document.createElement("img");
        img.src = canvas.toDataURL("image/png");

        const tip = document.createElement("div");
        tip.className = "tip";
        tip.textContent = "长按图片 → 保存到相册";

        const preview = document.getElementById("preview");
        preview.innerHTML = "";
        preview.appendChild(img);
        preview.appendChild(tip);

        preview.scrollIntoView({ behavior: "smooth" });
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Windows 时间区域截图模拟</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
    background:#f2f2f2;
    padding:30px;
    font-family: "Segoe UI", system-ui, -apple-system;
}

/* 整个截图区域 */
#win-shot {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #000;
    color: #fff;
    padding: 6px 12px;
    height: 48px;
    width: 520px;
    box-sizing: border-box;
}

/* 左侧图标区 */
.icons {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 18px;
}

/* ENG */
.lang {
    font-size: 15px;
    opacity: 0.95;
}

/* 时间日期 */
.time-box {
    text-align: center;
    margin-left: 6px;
    line-height: 1.1;
}

.time,
.date {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
}

/* 右侧通知 */
.notify {
    margin-left: auto;
    font-size: 18px;
    position: relative;
}

/* 红点数字 */
.notify::after {
    content: "1";
    position: absolute;
    top: -6px;
    right: -6px;
    background: #0078d4;
    color: #fff;
    font-size: 10px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    margin-top: 18px;
    padding: 10px 16px;
    font-size: 15px;
    background: #0078d4;
    border: none;
    color: #fff;
    border-radius: 4px;
}
</style>
</head>

<body>

<div id="win-shot">
    <div class="icons">
        <span>🖥️</span>
        <span>🔊</span>
    </div>

    <div class="lang">ENG</div>

    <div class="time-box">
        <div class="time" id="time">13:15</div>
        <div class="date" id="date">2025/12/30</div>
    </div>

    <div class="notify">💬</div>
</div>

<button onclick="download()">下载图片</button>

<script>
function updateTime() {
    const n = new Date();
    const h = String(n.getHours()).padStart(2, '0');
    const m = String(n.getMinutes()).padStart(2, '0');
    const y = n.getFullYear();
    const mo = String(n.getMonth()+1).padStart(2, '0');
    const d = String(n.getDate()).padStart(2, '0');

    time.textContent = `${h}:${m}`;
    date.textContent = `${y}/${mo}/${d}`;
}

updateTime();
setInterval(updateTime, 60000);

function download() {
    html2canvas(document.getElementById("win-shot"), {
        backgroundColor: "#000",
        scale: 2
    }).then(c => {
        const a = document.createElement("a");
        a.href = c.toDataURL("image/png");
        a.download = "windows_time.png";
        a.click();
    });
}
</script>

</body>
</html>
